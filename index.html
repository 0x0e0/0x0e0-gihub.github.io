<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>马戏团·动物翻牌配对</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 30%, #fdd98b, #f7b05e);
            font-family: 'Segoe UI', 'Comic Neue', 'Chalkboard SE', system-ui, cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* 马戏团装饰元素：彩带 + 帐篷尖顶 */
        body::before {
            content: "🎪";
            font-size: 70px;
            position: absolute;
            top: 10px;
            left: 15px;
            opacity: 0.3;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        body::after {
            content: "🎭";
            font-size: 60px;
            position: absolute;
            bottom: 15px;
            right: 15px;
            opacity: 0.3;
            transform: rotate(10deg);
            pointer-events: none;
        }

        /* 游戏主面板 - 马戏团大帐篷风格 */
        .game-container {
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            background: #fff6e8;
            background-image: repeating-linear-gradient(45deg, #ffeedd 0px, #ffeedd 2px, #ffe6d0 2px, #ffe6d0 8px);
            border-radius: 80px 80px 60px 60px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.25), inset 0 1px 4px rgba(255,255,200,0.8);
            padding: 20px 16px 28px;
            border-bottom: 8px solid #e34d2b;
            position: relative;
            transition: all 0.2s ease;
        }

        /* 帐篷飘旗装饰 */
        .game-container::before {
            content: "⚑ ⚐ ⚑";
            font-size: 1.8rem;
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #e34d2b;
            color: #ffde9c;
            padding: 4px 20px;
            border-radius: 40px 40px 20px 20px;
            letter-spacing: 8px;
            text-shadow: 0 1px 0 #a22f12;
            white-space: nowrap;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        /* 头部区域 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 28px;
            padding: 0 8px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .game-title {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e34d2b, #f7b05e, #ffda77);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.1);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .game-title span {
            font-size: 2rem;
            background: none;
            -webkit-background-clip: unset;
            color: #e34d2b;
            text-shadow: none;
        }

        .reset-btn {
            background: #ffcd7e;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 100px;
            color: #ac4a2a;
            box-shadow: 0 5px 0 #b75733;
            cursor: pointer;
            transition: 0.08s linear;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(2px);
            font-family: inherit;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b75733;
        }

        /* 卡片网格 4x4 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            justify-items: center;
            align-items: center;
            margin-bottom: 20px;
            padding: 6px;
        }

        /* 马戏团风格卡片：圆形+条纹边框 */
        .card {
            aspect-ratio: 1 / 1;
            width: 100%;
            background: radial-gradient(circle at 30% 35%, #fff3b0, #ffe0a3);
            background-image: repeating-linear-gradient(45deg, #ffd96622 0px, #ffd96622 5px, #ffb34722 5px, #ffb34722 12px);
            border-radius: 30px 20px 30px 20px;
            box-shadow: 0 12px 0 #b64a2a, 0 8px 12px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s;
            font-size: 3.3rem;
            font-weight: 500;
            color: #7a431d;
            transform: scale(1);
            text-shadow: 2px 2px 3px rgba(0,0,0,0.1);
            border: 2px solid #ffc285;
        }

        .card:active {
            transform: scale(0.96);
            box-shadow: 0 5px 0 #b64a2a;
        }

        /* 翻开/配对效果 */
        .card.revealed, .card.matched {
            background: #fffaf0;
            background-image: radial-gradient(circle at 20% 40%, #fff2cf, #ffefcf);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            border: 2px solid #f7b05e;
            color: #b1572e;
        }

        .card.matched {
            background: linear-gradient(145deg, #fff3cf, #ffe2b5);
            box-shadow: 0 0 0 3px #ffbc7a, 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: default;
            filter: drop-shadow(0 2px 6px rgba(227,77,43,0.4));
            border: 1px solid #ffb058;
        }

        .card.matched:active {
            transform: scale(1);
            box-shadow: 0 0 0 3px #ffbc7a;
        }

        /* 状态栏 马戏团票根样式 */
        .game-stats {
            text-align: center;
            margin: 12px auto 0;
            font-size: 1.2rem;
            font-weight: bold;
            background: #ffefcf;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding: 8px 24px;
            border-radius: 60px;
            color: #bf542f;
            font-family: monospace;
            letter-spacing: 1px;
            border: 2px dotted #ffb45e;
            box-shadow: inset 0 1px 3px #ffe1aa, 0 4px 8px rgba(0,0,0,0.05);
        }

        /* 二维码区域 — 马戏团小丑彩带装饰 */
        .qr-carrier {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 3px wavy #ffa75e;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .qr-carrier::before {
            content: "🎪🎈";
            font-size: 18px;
            position: absolute;
            top: -12px;
            background: #fde9c9;
            padding: 0 12px;
            border-radius: 60px;
        }

        .qr-label {
            font-size: 0.85rem;
            font-weight: bold;
            background: #ffddb0;
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            color: #b34b26;
            margin-bottom: 12px;
            letter-spacing: 1px;
            border: 1px solid #ffb87a;
        }

        .qr-code-box {
            background: #ffffffdd;
            backdrop-filter: blur(1px);
            padding: 10px;
            border-radius: 40px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            display: inline-block;
            margin-bottom: 8px;
            border: 2px solid #ffb258;
        }

        .qr-code-box img {
            width: 105px;
            height: 105px;
            display: block;
            border-radius: 24px;
            background: white;
        }

        .qr-tip {
            font-size: 0.7rem;
            color: #a35734;
            background: #fff2e2;
            padding: 5px 12px;
            border-radius: 50px;
            max-width: 260px;
            margin-top: 5px;
            font-weight: 500;
        }

        /* 弹窗 - 马戏团幕布效果 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(210, 85, 45, 0.55);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(145deg, #fff3e0, #ffe1bc);
            max-width: 290px;
            width: 75%;
            border-radius: 80px 50px 80px 50px;
            padding: 30px 20px 36px;
            text-align: center;
            box-shadow: 0 30px 35px rgba(120, 45, 20, 0.4);
            border: 4px solid #ffb562;
            animation: bouncePop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        @keyframes bouncePop {
            0% { transform: scale(0.7) rotate(-2deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .modal-card h3 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #dd522b;
            font-weight: 900;
        }

        .modal-card p {
            font-size: 1.1rem;
            margin: 16px 0 22px;
            color: #9b4a2c;
            font-weight: 600;
        }

        .modal-card button {
            background: #ffbc6e;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #823b1c;
            box-shadow: 0 5px 0 #c05a33;
            cursor: pointer;
            transition: 0.05s linear;
            font-family: inherit;
        }

        .modal-card button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c05a33;
        }

        footer {
            text-align: center;
            font-size: 0.65rem;
            color: #cb754a;
            margin-top: 18px;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .cards-grid {
                gap: 10px;
            }
            .card {
                border-radius: 20px 14px 20px 14px;
                font-size: 2.4rem;
            }
            .game-title {
                font-size: 1.5rem;
            }
            .reset-btn {
                padding: 5px 16px;
                font-size: 1rem;
            }
            .game-stats {
                font-size: 1rem;
                padding: 6px 18px;
            }
            .qr-code-box img {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="game-title">
            <span>🎪</span> 马戏团翻翻乐 <span>🎪</span>
        </div>
        <button class="reset-btn" id="resetGameBtn">🎡 新的一局 🎠</button>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="game-stats" id="pairStats">
        🎟️ 配对进度: 0 / 8
    </div>

    <!-- 二维码载体 马戏团风格 提供扫一扫 -->
    <div class="qr-carrier" id="qrCarrierArea">
        <div class="qr-label">🎭 扫一扫 · 好友共玩 🎭</div>
        <div class="qr-code-box" id="qrCodeContainer">
            <img id="dynamicQR" alt="游戏二维码" src="" style="width:105px; height:105px;">
        </div>
        <div class="qr-tip">
            🤡 用手机扫码 → 立即进入马戏团<br>
            🐘 一起配对可爱小动物！
        </div>
    </div>
    <footer>✨ 翻开卡片，找到相同的小动物明星 ✨</footer>
</div>

<!-- 通关弹窗 -->
<div id="winModal" class="modal-overlay">
    <div class="modal-card">
        <h3>🎉 精彩表演 🎉</h3>
        <p>所有动物配对成功！马戏团为你喝彩🌟</p>
        <button id="modalResetBtn">🎪 再来一次 🎪</button>
    </div>
</div>

<script>
    // ----------------------------- 游戏配置 ---------------------------------
    // 马戏团小动物阵营 (全部可爱动物emoji，符合主题)
    const PAIR_THEMES = ["🐘", "🦁", "🐒", "🐧", "🐨", "🦝", "🐰", "🐢"];
    const TOTAL_PAIRS = 8;
    const TOTAL_CARDS = TOTAL_PAIRS * 2;

    let cardsArray = [];          // { id, pattern, matched, flipped }
    let firstIndex = null;
    let secondIndex = null;
    let lockBoard = false;
    let matchCount = 0;
    let flipTimeout = null;

    const gridContainer = document.getElementById('cardsGrid');
    const pairStatsSpan = document.getElementById('pairStats');
    const resetBtn = document.getElementById('resetGameBtn');
    const winModal = document.getElementById('winModal');
    const modalResetBtn = document.getElementById('modalResetBtn');

    // ----- 辅助函数 -----
    function updateStatsUI() {
        pairStatsSpan.innerHTML = `🎟️ 配对进度: ${matchCount} / ${TOTAL_PAIRS}`;
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initCardData() {
        let rawCards = [];
        for (let i = 0; i < TOTAL_PAIRS; i++) {
            const pattern = PAIR_THEMES[i];
            rawCards.push({ id: Math.random(), pattern, matched: false, flipped: false });
            rawCards.push({ id: Math.random(), pattern, matched: false, flipped: false });
        }
        return shuffleArray(rawCards);
    }

    function updateSingleCardUI(index) {
        const cardDiv = gridContainer.children[index];
        if (!cardDiv) return;
        const cardData = cardsArray[index];
        let displayContent = "?";
        if (cardData.matched) displayContent = cardData.pattern;
        else if (cardData.flipped) displayContent = cardData.pattern;
        else displayContent = "?";
        cardDiv.innerText = displayContent;
        if (cardData.matched) {
            cardDiv.classList.add('matched');
            cardDiv.classList.remove('revealed');
        } else if (cardData.flipped) {
            cardDiv.classList.add('revealed');
            cardDiv.classList.remove('matched');
        } else {
            cardDiv.classList.remove('revealed', 'matched');
        }
    }

    function renderAllCards() {
        for (let i = 0; i < cardsArray.length; i++) {
            updateSingleCardUI(i);
        }
        updateStatsUI();
    }

    function handleMatch(idxA, idxB) {
        cardsArray[idxA].matched = true;
        cardsArray[idxB].matched = true;
        cardsArray[idxA].flipped = false;
        cardsArray[idxB].flipped = false;
        updateSingleCardUI(idxA);
        updateSingleCardUI(idxB);
        matchCount++;
        updateStatsUI();
        firstIndex = null;
        secondIndex = null;
        checkVictory();
    }

    function handleMismatch(idxA, idxB) {
        if (flipTimeout) clearTimeout(flipTimeout);
        flipTimeout = setTimeout(() => {
            if (!cardsArray[idxA].matched && cardsArray[idxA].flipped === true) {
                cardsArray[idxA].flipped = false;
                updateSingleCardUI(idxA);
            }
            if (!cardsArray[idxB].matched && cardsArray[idxB].flipped === true) {
                cardsArray[idxB].flipped = false;
                updateSingleCardUI(idxB);
            }
            firstIndex = null;
            secondIndex = null;
            lockBoard = false;
            flipTimeout = null;
        }, 700);
    }

    function checkVictory() {
        if (matchCount === TOTAL_PAIRS) {
            if (flipTimeout) clearTimeout(flipTimeout);
            lockBoard = false;
            winModal.classList.add('active');
        }
    }

    function onCardClick(clickedIdx) {
        if (lockBoard) return;
        const card = cardsArray[clickedIdx];
        if (!card) return;
        if (card.matched) return;
        if (card.flipped === true) return;

        if (firstIndex === null) {
            cardsArray[clickedIdx].flipped = true;
            updateSingleCardUI(clickedIdx);
            firstIndex = clickedIdx;
            return;
        }

        if (firstIndex !== null && secondIndex === null) {
            if (firstIndex === clickedIdx) return;
            cardsArray[clickedIdx].flipped = true;
            updateSingleCardUI(clickedIdx);
            secondIndex = clickedIdx;

            const card1 = cardsArray[firstIndex];
            const card2 = cardsArray[secondIndex];
            const isMatch = (card1.pattern === card2.pattern);

            if (isMatch) {
                handleMatch(firstIndex, secondIndex);
                if (flipTimeout) clearTimeout(flipTimeout);
                lockBoard = false;
            } else {
                lockBoard = true;
                handleMismatch(firstIndex, secondIndex);
            }
            return;
        }

        // 防御性重置
        if (firstIndex !== null && secondIndex !== null) {
            if (flipTimeout) clearTimeout(flipTimeout);
            for (let i = 0; i < cardsArray.length; i++) {
                if (!cardsArray[i].matched && cardsArray[i].flipped) {
                    cardsArray[i].flipped = false;
                    updateSingleCardUI(i);
                }
            }
            firstIndex = null;
            secondIndex = null;
            lockBoard = false;
            onCardClick(clickedIdx);
        }
    }

    function buildGameBoard() {
        while (gridContainer.firstChild) gridContainer.removeChild(gridContainer.firstChild);
        for (let i = 0; i < cardsArray.length; i++) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            cardDiv.innerText = "?";
            cardDiv.setAttribute('data-index', i);
            cardDiv.addEventListener('click', (function(idx) {
                return function() { onCardClick(idx); };
            })(i));
            gridContainer.appendChild(cardDiv);
        }
        renderAllCards();
    }

    function resetAndNewGame() {
        if (flipTimeout) clearTimeout(flipTimeout);
        firstIndex = null;
        secondIndex = null;
        lockBoard = false;
        matchCount = 0;
        cardsArray = initCardData();
        buildGameBoard();
        winModal.classList.remove('active');
        updateStatsUI();
    }

    // ---------- 二维码载体：可扫一扫，此版本保持动态生成当前页面URL（支持分享）----------
    function refreshQRCode() {
        const qrImg = document.getElementById('dynamicQR');
        if (!qrImg) return;
        let currentUrl = window.location.href;
        const isFileProtocol = currentUrl.startsWith('file://');
        // 使用免费 QR 服务，生成二维码图片（无外部插件依赖）
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(currentUrl)}`;
        qrImg.src = qrApiUrl;
        qrImg.alt = "马戏团游戏二维码";
        const tipDiv = document.querySelector('.qr-tip');
        if (tipDiv) {
            if (isFileProtocol) {
                tipDiv.innerHTML = `📌 本地文件二维码暂无法扫描。将网页部署到服务器即可扫码同玩！<br> 🎪 马戏团期待你的分享 🎪`;
            } else {
                tipDiv.innerHTML = `🤡 扫码秒玩 · 和马戏团小动物一起配对！<br> 🎈 分享二维码给小伙伴 🎈`;
            }
        }
    }

    // 页面加载完成后生成二维码
    window.addEventListener('load', () => {
        refreshQRCode();
    });

    // 重置 & 模态重置按钮逻辑
    resetBtn.addEventListener('click', () => {
        if (flipTimeout) clearTimeout(flipTimeout);
        resetAndNewGame();
    });
    modalResetBtn.addEventListener('click', () => {
        resetAndNewGame();
        winModal.classList.remove('active');
    });
    // 点击弹窗背景关闭弹窗
    winModal.addEventListener('click', (e) => {
        if (e.target === winModal) {
            winModal.classList.remove('active');
        }
    });

    // 初始化游戏
    (function initGame() {
        cardsArray = initCardData();
        buildGameBoard();
        matchCount = 0;
        updateStatsUI();
        firstIndex = null;
        secondIndex = null;
        lockBoard = false;
        if (flipTimeout) clearTimeout(flipTimeout);
        winModal.classList.remove('active');
        refreshQRCode(); 
    })();
</script>
</body>
</html>
